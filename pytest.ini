[pytest]
testpaths = tests/python
addopts = -p no:cacheprovider
markers =
    binary: needs the built singvst-render in SINGVST_RENDER_BIN (CI job python; S-010)
    torch: needs torch and the pinned RVC checkout (CI job python-torch; S-013)
    voice: needs a trained voice package and held-out data (owner's run at gate G-004; S-017)
    network: needs package-index access (CI job repo; T-P21, run at S-000)
